services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: backend/DatingApp.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY (at least 32 bytes)}
      Jwt__Issuer: DatingApp.Api
      Jwt__Audience: DatingApp.Client
      Jwt__ExpireMinutes: 10
      Auth__FrontendUrl: ${AUTH_FRONTEND_URL:?Set HTTPS frontend URL}
      Email__From: ${EMAIL_FROM:?Set EMAIL_FROM}
      Email__SmtpHost: ${SMTP_HOST:?Set SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      DataProtection__KeyPath: /var/lib/datingapp/keys
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    volumes:
      - staging_auth_keys:/var/lib/datingapp/keys
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

volumes:
  staging_postgres_data:
  staging_auth_keys:

networks:
  internal:

name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  staging-compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: issue31ci
      COMPOSE_FILE: compose.staging.yml
      POSTGRES_DB: smoke
      POSTGRES_USER: smoke
      AUTH_FRONTEND_URL: https://localhost:8443
      EMAIL_FROM: smoke@example.test
      SMTP_HOST: unused.invalid
      SMTP_USERNAME: unused
      SMTP_PASSWORD: unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, migrate and smoke-test the staging stack on the runner
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)" JWT_KEY="$(openssl rand -hex 32)"
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait postgres
          export TRUSTED_PROXY_CIDR="$(docker network inspect issue31ci_internal --format '{{(index .IPAM.Config 0).Subnet}}')"
          docker compose run --rm --no-deps api --migrate=true
          docker compose up -d --wait
          tls="$RUNNER_TEMP/issue31-tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' -keyout "$tls/privkey.pem" -out "$tls/fullchain.pem"
          sed -e 's/staging.example.org/localhost/g' -e 's/listen 80;/listen 8181;/' \
            -e 's/listen 443 ssl;/listen 8443 ssl;/' infra/staging-edge.nginx.conf.example > "$tls/edge.conf"
          docker run -d --name issue31-edge --network host \
            -v "$tls/edge.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$tls:/etc/letsencrypt/live/localhost:ro" nginx:1.29-alpine
          export NODE_EXTRA_CA_CERTS="$tls/fullchain.pem"
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --cacert "$tls/fullchain.pem" https://localhost:8443/healthz
          node scripts/staging-smoke.mjs https://localhost:8443
          docker compose exec -T postgres psql -U smoke -d smoke -v ON_ERROR_STOP=1 -c "CREATE TABLE issue31_probe AS SELECT 31 AS value"
          docker compose stop web api postgres
          docker compose up -d --wait --force-recreate
          node scripts/staging-smoke.mjs https://localhost:8443
          test "$(docker compose exec -T postgres psql -U smoke -d smoke -Atc 'SELECT value FROM issue31_probe')" = 31
  repository-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared project layout
        shell: pwsh
        run: ./scripts/Test-RepositoryLayout.ps1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datingapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datingapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AUTH_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=datingapp_test;Username=postgres;Password=ci_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DatingApp.slnx
      - run: dotnet build DatingApp.slnx --no-restore --configuration Release
      - run: dotnet tool restore
      - run: dotnet ef database update --project backend/DatingApp.Api --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=datingapp_test;Username=postgres;Password=ci_test_password
          Jwt__Key: ci-only-test-signing-key-at-least-32-bytes
          Auth__FrontendUrl: https://frontend.test
      - run: dotnet ef migrations has-pending-model-changes --project backend/DatingApp.Api --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=datingapp_test;Username=postgres;Password=ci_test_password
      - run: dotnet test DatingApp.slnx --no-build --configuration Release
